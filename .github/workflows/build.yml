# 推送/PR 触发的冒烟构建：只构建断代差异最大的 4 个代表节点，快速验证编译
# 全量构建（26 节点）只在发版工作流（tag 推送）执行，避免每次推送等一小时
name: 冒烟构建

# 只构建不发布，token 最小权限：只读
permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 26.x 节点用 JDK 25 编译，1.20.6+ 节点经 Gradle 工具链自动选用 JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # 非 main 分支只读缓存，防止不可信分支污染主缓存（TweakerMore 同款做法）
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 并行已在 gradle.properties 关闭（preprocessCode 锁限制）；1.16.5 编 target 8 由 Gradle JVM(JDK 25) 承担，与本地一致
      - name: 构建代表节点
        run: |
          chmod +x gradlew
          ./gradlew :26.1.2:build :1.16.5:build :1.21.11:build :1.20.4-neoforge:build

      - name: 收集产物名
        run: ls -1 build/libs/ versions/*/build/libs/ 2>/dev/null || true
