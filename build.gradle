plugins {
	id 'maven-publish'
	// SNAPSHOT 是流动快照，上游重新发布即可能炸构建；固定到 1.17 系列最新 GA（2026-09-20 查证 maven.fabricmc.net）
	id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.17.21' apply false
	id 'net.neoforged.moddev' version '2.0.141' apply false

	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'c5abb4fb12'
}

preprocess {
	strictExtraMappings = false

	def mc1165  = createNode('1.16.5', 1_16_05, '')
	def mc1171  = createNode('1.17.1', 1_17_01, '')
	def mc1182  = createNode('1.18.2', 1_18_02, '')
	def mc1194  = createNode('1.19.4', 1_19_04, '')
	def mc1201  = createNode('1.20.1', 1_20_01, '')
	def mc1202  = createNode('1.20.2', 1_20_02, '')
	def mc1204  = createNode('1.20.4', 1_20_04, '')
	def mc1206  = createNode('1.20.6', 1_20_06, '')
	def mc1211  = createNode('1.21.1', 1_21_01, '')
	def mc1213  = createNode('1.21.3', 1_21_03, '')
	def mc1214  = createNode('1.21.4', 1_21_04, '')
	def mc1215  = createNode('1.21.5', 1_21_05, '')
	def mc1218  = createNode('1.21.8', 1_21_08, '')
	def mc12110 = createNode('1.21.10', 1_21_10, '')
	def mc12111 = createNode('1.21.11', 1_21_11, '')
	def mc26012 = createNode('26.1.2', 26_01_02, '')

	// NeoForge 平行链（数据流与 Fabric 链同向：主项目 26.1.2 → 新版本 → 老版本）
	def mc1204nf  = createNode('1.20.4-neoforge', 1_20_04, '')
	def mc1206nf  = createNode('1.20.6-neoforge', 1_20_06, '')
	def mc1211nf  = createNode('1.21.1-neoforge', 1_21_01, '')
	def mc1213nf  = createNode('1.21.3-neoforge', 1_21_03, '')
	def mc1214nf  = createNode('1.21.4-neoforge', 1_21_04, '')
	def mc1215nf  = createNode('1.21.5-neoforge', 1_21_05, '')
	def mc1218nf  = createNode('1.21.8-neoforge', 1_21_08, '')
	def mc12110nf = createNode('1.21.10-neoforge', 1_21_10, '')
	def mc12111nf = createNode('1.21.11-neoforge', 1_21_11, '')
	def mc26012nf = createNode('26.1.2-neoforge', 26_01_02, '')

	mc1165.link(mc1171, file('versions/mapping-1.16-1.17.txt'))
	mc1171.link(mc1182, null)
	mc1182.link(mc1194, null)
	mc1194.link(mc1201, null)
	mc1201.link(mc1202, null)
	mc1202.link(mc1204, null)
	mc1204.link(mc1206, null)
	mc1206.link(mc1211, null)
	mc1211.link(mc1213, null)
	mc1213.link(mc1214, null)
	mc1214.link(mc1215, null)
	mc1215.link(mc1218, null)
	mc1218.link(mc12110, null)
	mc12110.link(mc12111, null)
	mc12111.link(mc26012, null)

	// link(数据目标, 数据源)：所有 NeoForge 节点直接从主项目（26.1.2，根 src，Mojmap）派生，
	// 各自按自身 mcVersion + NEOFORGE=1 求值条件编译（版本差异全部由 //#if MC 消化）。
	// 不能串成 NeoForge 链：preprocess 插件配置非主项目时要访问父项目的 loom 扩展，
	// MDG 节点没有 loom 扩展，串行链会在第二个节点配置时失败
	mc1204nf.link(mc26012, null)
	mc1206nf.link(mc26012, null)
	mc1211nf.link(mc26012, null)
	mc1213nf.link(mc26012, null)
	mc1214nf.link(mc26012, null)
	mc1215nf.link(mc26012, null)
	mc1218nf.link(mc26012, null)
	mc12110nf.link(mc26012, null)
	mc12111nf.link(mc26012, null)
	mc26012nf.link(mc26012, null)

	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = { p -> p.buildDir.toPath().resolve('libs') }
		delete fileTree(buildLibs(rootProject)) { include '*' }
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy = DuplicatesStrategy.INCLUDE
			}
		}
	}
}

tasks.register('cleanPreprocessSources') {
	doFirst {
		subprojects {
			def path = project.projectDir.toPath().resolve('build/preprocessed')
			if (path.toFile().isDirectory()) {
				path.toFile().deleteDir()
			}
		}
	}
}
