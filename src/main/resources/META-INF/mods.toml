modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "cbtc-59"
logoFile = "assets/${id}/icon.png"
logoBlur = false
description = '''
玩家掉入虚空时自动断开连接/退出世界，防止死亡丢物品。
'''

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "CLIENT"
